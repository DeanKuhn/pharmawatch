[project]
name = "pharmawatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adbc-driver-postgresql>=1.11.0",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "polars>=1.42.1",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "dbt-duckdb>=1.10.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faers"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]

[tool.pyright]
typeCheckingMode = "basic"
extraPaths = ["src", "scripts"]
