version: 2

models:
  - name: int_drug_reaction_pairs
    description: "Each unique (case, drug identity, reaction) triple for primary suspect drugs only. Grain: one row per primaryid + identity_key + reaction_pt. Multiple doses, and PS rows whose prod_ai strings resolve to the same identity, are collapsed. Rows with null identity_key (no prod_ai_resolved, ambiguous, non_specific) are kept for background totals."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['primaryid', 'identity_key', 'reaction_pt']
    columns:
      - name: primaryid
        description: "Case identifier"
        tests:
          - not_null
      - name: identity_key
        description: "Drug identity from int_prod_ai_identity; null when the PS drug has no identity"
      - name: reaction_pt
        description: "MedDRA Preferred Term for the adverse reaction"

  - name: int_case_demographics
    description: "Case demographics with normalized age (converted to years) and bucketed age groups. One row per case."
    columns:
      - name: primaryid
        description: "Case identifier"
        tests:
          - not_null
          - unique
      - name: age_years
        description: "Patient age normalized to years from the original unit (YR, DEC, MON, WK, DY, HR)"
      - name: age_group
        description: "Age bucket: 0-17, 18-44, 45-64, 65+, or Unknown"
        tests:
          - accepted_values:
              arguments:
                values: ['0-17', '18-44', '45-64', '65+', 'Unknown']
      - name: sex
        description: "Normalized sex: Male, Female, or Unknown"
        tests:
          - accepted_values:
              arguments:
                values: ['Male', 'Female', 'Unknown']
      - name: reporter_country
        description: "Two-letter country code of the reporter"
      - name: event_dt
        description: "Date the adverse event occurred"
      - name: occp_cod
        description: "Reporter occupation code (MD, PH, CN, etc.)"
  - name: int_contingency
    description: "2x2 contingency table per drug-reaction pair, shared by mart_prr and mart_ror. Counts are distinct cases (primaryid) from int_drug_reaction_pairs. Grain: one row per identity_key + reaction_pt. a and b count only keyed rows; c, d and N include null-identity cases (background). Unfiltered — marts apply their own thresholds."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['identity_key', 'reaction_pt']
    columns:
      - name: identity_key
        description: "Drug identity from int_prod_ai_identity"
      - name: reaction_pt
        description: "MedDRA Preferred Term"
      - name: a
        description: "Cases reporting this drug and this reaction"
      - name: b
        description: "Cases reporting this drug but not this reaction"
      - name: c
        description: "Cases reporting this reaction but not this drug"
      - name: d
        description: "Cases reporting neither this drug nor this reaction"

  - name: int_drugname_lookup
    description: "Cleaned drugname → modal prod_ai, built from stg_drug rows with prod_ai filled (all roles). Grain: one row per drugname_clean. All bands kept; which bands fill prod_ai is decided downstream (decision 002)."
    columns:
      - name: drugname_clean
        description: "Cleaned drugname (clean_drugname macro)"
        tests:
          - not_null
          - unique
      - name: modal_ai
        description: "Most frequent prod_ai for this name; ties broken arbitrarily"
        tests:
          - not_null
      - name: support
        description: "Rows with prod_ai filled for this name"
      - name: band
        description: "low_support (support < 5), pure (purity >= 0.95), mostly (>= 0.8), else ambiguous"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['low_support', 'pure', 'mostly', 'ambiguous']
      - name: purity
        description: "Share of support held by modal_ai"
      - name: n_ai
        description: "Distinct prod_ai values for this name"

  - name: int_drug_resolved
    description: "stg_drug with prod_ai filled from int_drugname_lookup where FDA left it null (mostly pre-2014Q3). Only 'pure' lookup matches fill. Original prod_ai is kept untouched (decision 003). Grain: one row per stg_drug row. primaryid + drug_seq is not a key (see mess_log), so don't join back to stg_drug on it; carry needed columns here instead."
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_drug')
    columns:
      - name: primaryid
        description: "Case identifier"
        tests:
          - not_null
      - name: drugname
        description: "Drug name as reported (upper/trimmed)"
      - name: drugname_clean
        description: "Cleaned drugname (clean_drugname macro); lookup join key"
      - name: prod_ai
        description: "Active ingredient(s) as filled by FDA; null for most pre-2014Q3 rows"
      - name: band
        description: "Lookup band for drugname_clean (low_support, pure, mostly, ambiguous); null when the name isn't in the lookup"
        tests:
          - accepted_values:
              arguments:
                values: ['low_support', 'pure', 'mostly', 'ambiguous']
      - name: prod_ai_resolved
        description: "prod_ai if reported, else the lookup's modal_ai when band = 'pure', else null"
      - name: prod_ai_source
        description: "'reported' (FDA-filled), 'lookup' (filled from a pure lookup match), or null (unresolved)"
        tests:
          - accepted_values:
              arguments:
                values: ['reported', 'lookup']

  - name: int_piece_ingredients
    description: "Identity per prod_ai piece (A4). prod_ai_resolved is split on ' OR ' (007) then '\\', upper/trimmed. Rules in precedence order, lowest rule_rank wins: 1 seed map (011), 2 RxNav single IN, 3 exact-name pick among several INs (009), 4 placeholders (006), 6 local fallback (010). 007's ambiguous status is set at prod_ai level downstream, not here. Grain: one row per piece."
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(identity is null) = (status in ('ambiguous', 'non_specific'))"
    columns:
      - name: piece
        description: "Uppercased, trimmed prod_ai piece"
        tests:
          - not_null
          - unique
      - name: identity
        description: "Identity element: 'rxcui:<rxcui>' or 'local:<token>'; null for ambiguous and non_specific pieces"
      - name: identity_source
        description: "rxnorm | local (010); null when identity is null"
        tests:
          - accepted_values:
              arguments:
                values: ['rxnorm', 'local']
      - name: tty
        description: "IN, or PIN for seeded biologics (001 amendment); null for local and identity-less pieces"
        tests:
          - accepted_values:
              arguments:
                values: ['IN', 'PIN']
      - name: status
        description: "matched (RxNorm or seed), ambiguous (009 found 0 or 2+ exact-name INs), non_specific (006 placeholder), unmatched (local fallback)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'ambiguous', 'non_specific', 'unmatched']
      - name: rule
        description: "Rule that won for this piece"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['seed', 'rxnav_in', 'name_pick', 'placeholder', 'local']
      - name: rule_rank
        description: "Precedence of the winning rule (1 = highest)"
      - name: n_rows
        description: "Drug rows whose prod_ai_resolved contains this piece (a combo row counts once per piece)"

  - name: int_prod_ai_identity
    description: "Drug identity per prod_ai_resolved (B1). Pieces split exactly as in int_piece_ingredients, joined to their identity, rolled back up. Status, first hit wins: ' OR ' in string (007) or any ambiguous piece → ambiguous; any non_specific piece → non_specific; any local-fallback piece → unmatched; else matched. Grain: one row per prod_ai_resolved."
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(identity_key is null) = (status in ('ambiguous', 'non_specific'))"
    columns:
      - name: prod_ai_resolved
        description: "prod_ai string from int_drug_resolved"
        tests:
          - not_null
          - unique
      - name: n_rows
        description: "Drug rows carrying this prod_ai_resolved"
      - name: status
        description: "matched (no piece fell to 010 fallback; seeded local: identities count as matched), unmatched (at least one local-fallback piece), ambiguous, non_specific"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'unmatched', 'ambiguous', 'non_specific']
      - name: identity_set
        description: "Sorted, distinct piece identities; null for ambiguous and non_specific"
      - name: identity_key
        description: "identity_set joined with '|'; drug key for int_contingency and dim_drug"
      - name: n_ingredients
        description: "Length of identity_set"
