version: 2

models:
  - name: dim_drug
    description: "Drug dimension. One row per identity_key from int_prod_ai_identity (matched and unmatched only)."
    columns:
      - name: drug_key
        description: "Surrogate key (hash of identity_key)"
        tests:
          - unique
          - not_null
      - name: identity_key
        description: "Sorted, '|'-joined ingredient identities"
        tests:
          - not_null
          - unique
      - name: drug_label
        description: "Display name: the prod_ai_resolved string with the most drug rows for this identity"
        tests:
          - not_null
      - name: status
        description: "unmatched if any contributing string has a local-fallback piece, else matched"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'unmatched']
      - name: n_ingredients
        description: "Number of ingredient identities in the set"

  - name: dim_reaction
    description: "Reaction dimension. One row per unique MedDRA Preferred Term."
    columns:
      - name: reaction_key
        description: "Surrogate key (hash of reaction_pt)"
        tests:
          - unique
          - not_null
      - name: reaction_pt
        description: "MedDRA Preferred Term for the adverse reaction"
        tests:
          - not_null
          - unique

  - name: dim_outcome
    description: "Outcome dimension. One row per FDA outcome code with decoded label."
    columns:
      - name: outcome_key
        description: "Surrogate key (hash of outcome_code)"
        tests:
          - unique
          - not_null
      - name: outcome_code
        description: "FDA outcome code: DE, HO, LT, DS, CA, RI, OT"
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['DE', 'HO', 'LT', 'DS', 'CA', 'RI', 'OT']
      - name: outcome_desc
        description: "Human-readable outcome label (Death, Hospitalization, etc.)"

  - name: dim_demographics
    description: "Demographics dimension. One row per unique (age_group, sex, reporter_country) combination."
    columns:
      - name: demographics_key
        description: "Surrogate key (hash of age_group + sex + reporter_country)"
        tests:
          - unique
          - not_null
      - name: age_group
        description: "Age bucket: 0-17, 18-44, 45-64, 65+, or Unknown"
      - name: sex
        description: "Normalized sex: Male, Female, or Unknown"
      - name: reporter_country
        description: "Two-letter country code of the reporter"

  - name: fct_adverse_events
    description: "Fact table. Grain: one row per (case, drug, reaction) triple for primary suspect drugs. Surrogate FKs to all dimensions, outcome boolean flags pre-aggregated to avoid grain multiplication, plus degenerate dimensions (identity_key, reaction_pt). drug_key and identity_key are null for PS drugs with no identity."
    columns:
      - name: primaryid
        description: "Case identifier"
        tests:
          - not_null
      - name: drug_key
        description: "FK to dim_drug; null when the PS drug has no identity"
        tests:
          - relationships:
              arguments:
                to: ref('dim_drug')
                field: drug_key
      - name: reaction_key
        description: "FK to dim_reaction"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_reaction')
                field: reaction_key
      - name: demographics_key
        description: "FK to dim_demographics"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_demographics')
                field: demographics_key
      - name: identity_key
        description: "Degenerate dimension: drug identity"
      - name: reaction_pt
        description: "Degenerate dimension: MedDRA Preferred Term"
      - name: event_dt
        description: "Date the adverse event occurred"
      - name: has_death
        description: "1 if case outcome includes death, else 0"
      - name: has_hospitalization
        description: "1 if case outcome includes hospitalization, else 0"
      - name: has_life_threatening
        description: "1 if case outcome includes life-threatening, else 0"
      - name: has_disability
        description: "1 if case outcome includes disability, else 0"
      - name: has_congenital_anomaly
        description: "1 if case outcome includes congenital anomaly, else 0"
      - name: has_required_intervention
        description: "1 if case outcome includes required intervention, else 0"
      - name: has_other_outcome
        description: "1 if case outcome includes other/unspecified outcome, else 0"

  - name: mart_prr
    description: "Proportional Reporting Ratio (PRR) signal detection. One row per drug-reaction pair with a >= 3 cases. Uses 2x2 contingency table with log-transformed 95% confidence intervals."
    columns:
      - name: identity_key
        description: "Drug identity (join to dim_drug for the label)"
        tests:
          - not_null
      - name: reaction_pt
        description: "MedDRA Preferred Term"
        tests:
          - not_null
      - name: a
        description: "Cases reporting this drug and this reaction (always >= 3)"
        tests:
          - not_null
      - name: b
        description: "Cases reporting this drug but not this reaction (always > 0)"
      - name: c
        description: "Cases reporting this reaction but not this drug (always > 0). Small values drive extreme ratios."
      - name: d
        description: "Cases reporting neither this drug nor this reaction (always > 0)"
      - name: prr
        description: "Proportional Reporting Ratio: (a/(a+b)) / (c/(c+d)). Values > 1 suggest disproportionate reporting."
        tests:
          - not_null
      - name: prr_lower
        description: "Lower bound of 95% CI (log-transformed)"
      - name: prr_upper
        description: "Upper bound of 95% CI (log-transformed)"
      - name: chi_square
        description: "Yates-corrected chi-square: N(|ad - bc| - N/2)^2 / ((a+b)(c+d)(a+c)(b+d)), N = a+b+c+d. Correction floored at 0."
        tests:
          - not_null
      - name: is_evans_signal
        description: "Evans et al. (2001) screening criteria: prr >= 2 AND chi_square >= 4 AND a >= 3. A screening flag, not a ranking — sparse-cell pairs pass easily."
        tests:
          - not_null

  - name: mart_ror
    description: "Reporting Odds Ratio (ROR) signal detection. One row per drug-reaction pair with a >= 3 cases. Uses 2x2 contingency table with log-transformed 95% confidence intervals."
    columns:
      - name: identity_key
        description: "Drug identity (join to dim_drug for the label)"
        tests:
          - not_null
      - name: reaction_pt
        description: "MedDRA Preferred Term"
        tests:
          - not_null
      - name: a
        description: "Cases reporting this drug and this reaction (always >= 3)"
        tests:
          - not_null
      - name: b
        description: "Cases reporting this drug but not this reaction (always > 0)"
      - name: c
        description: "Cases reporting this reaction but not this drug (always > 0). Small values drive extreme ratios."
      - name: d
        description: "Cases reporting neither this drug nor this reaction (always > 0)"
      - name: ror
        description: "Reporting Odds Ratio: (a*d)/(b*c). Values > 1 suggest disproportionate reporting."
        tests:
          - not_null
      - name: ror_lower
        description: "Lower bound of 95% CI (log-transformed)"
      - name: ror_upper
        description: "Upper bound of 95% CI (log-transformed)"

  - name: mart_signals
    description: "BCPNN information component (IC) with +0.5 shrinkage, ranked by IC025 (decision 013), plus stimulated-reporting caveat columns (C2). One row per int_contingency pair, unfiltered: shrinkage handles small a. _nolw columns recompute the full 2x2 table without lawyer-reported cases (occp_cod = 'LW')."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['identity_key', 'reaction_pt']
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('int_contingency')
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ic025 <= ic and ic025_nolw <= ic_nolw"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "a_nolw <= a and peak_quarter_n <= a"
    columns:
      - name: identity_key
        description: "Drug identity (join to dim_drug for the label)"
        tests:
          - not_null
      - name: reaction_pt
        description: "MedDRA Preferred Term"
        tests:
          - not_null
      - name: expected
        description: "Expected count under independence: (a+b)(a+c)/n"
      - name: ic
        description: "log2((a + 0.5) / (expected + 0.5)). > 0 means reported more often than expected."
        tests:
          - not_null
      - name: ic025
        description: "Lower 95% credibility bound of IC (Norén closed-form approximation). Signal criterion: ic025 > 0. Ranking column."
        tests:
          - not_null
      - name: ic_nolw
        description: "IC with lawyer-reported cases removed from all four cells and n"
        tests:
          - not_null
      - name: ic025_nolw
        description: "IC025 with lawyer-reported cases removed. A signal that drops below 0 here is litigation-driven."
        tests:
          - not_null
      - name: pct_lw
        description: "Share of the pair's a cases that are lawyer-reported, (a - a_nolw) / a"
        tests:
          - not_null
      - name: peak_quarter
        description: "Quarter (by init_fda_dt, falling back to fda_dt) holding the most of the pair's cases"
      - name: peak_quarter_n
        description: "Cases in peak_quarter. Not null proves every pair found its quarter counts."
        tests:
          - not_null
      - name: peak_quarter_share
        description: "peak_quarter_n / a. Bursty reporting flag; trivially high when a is small, so read it only above a minimum a."
