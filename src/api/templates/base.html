<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PharmaWatch{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>

<body>
  <header>
    <nav class="wrap">
      <a class="brand" href="/">Pharma<span>Watch</span></a>
      <div class="nav-links">
        <a href="/">Search</a>
        <a href="/methodology">Methodology</a>
      </div>
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="wrap">
      <p>Data: FDA Adverse Event Reporting System (FAERS). Reports are voluntary and unverified.</p>
      <p>Disproportionality signals are not evidence of causation. Not medical advice.</p>
    </div>
  </footer>
</body>

</html>
